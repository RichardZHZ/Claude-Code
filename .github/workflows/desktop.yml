# 在 GitHub 的 macOS 机器上打包桌面应用（Apple 芯片 arm64、Intel x64 两个 .dmg）。
# - 拉取请求：打包并试启动，安装包作为本次运行的附件（Artifacts）可下载。
# - 发布版本：在 Actions 页面手动运行本流程并填写版本号（如 v0.1.0），或推送 v 开头的标签。
#   安装包会发布到 GitHub Releases，版本号必须和 apps/desktop/package.json 的 version 一致。
name: Desktop app

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号，例如 v0.1.0。留空则只打包、不发布。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check release version
        id: version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        env:
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::版本号 $TAG 和 apps/desktop/package.json 里的 $expected 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package
        run: pnpm desktop:package --mac --arch arm64,x64
        env:
          # 没有 Apple 开发者证书：不去钥匙串里找，使用 ad-hoc 签名。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 默认不给拉取请求签名。ad-hoc 签名不用任何密钥，放开它，
          # 否则拉取请求打出的安装包下载后会被 macOS 判定为"已损坏"。
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Verify signatures
        run: |
          for app in apps/desktop/release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature=|Identifier='
          done

      - name: Smoke test (start the arm64 app and wait for its server)
        run: |
          app=$(ls -d apps/desktop/release/mac-arm64/*.app)
          exe="$app/Contents/MacOS/$(basename "$app" .app)"
          export DB_PATH="$RUNNER_TEMP/rp/researchpilot.db"
          "$exe" &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/today | grep -q '<title>'
          curl -sf http://127.0.0.1:8787/widget | grep -q '<title>'
          kill $pid
          wait $pid || true
          cat "$RUNNER_TEMP/rp/logs/desktop.log"

      - uses: actions/upload-artifact@v4
        with:
          name: ResearchPilot-mac
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 标签不存在时，在本次构建的提交上创建。
          target_commitish: ${{ github.sha }}
          name: 科研小助理 ${{ steps.version.outputs.tag }}
          files: apps/desktop/release/*.dmg
          body: |
            ## 下载

            | 你的 Mac | 下载 |
            | --- | --- |
            | Apple 芯片（M1 及以后） | `ResearchPilot-*-arm64.dmg` |
            | Intel 芯片 | `ResearchPilot-*-x64.dmg` |

            不确定的话：左上角苹果菜单 → "关于本机"，看"芯片"一栏。

            ## 安装

            1. 双击 `.dmg`，把"科研小助理"拖进"应用程序"文件夹。
            2. 第一次打开会被系统拦下（应用没有 Apple 开发者签名）。任选一种方法放行，只需一次：
               - "系统设置 → 隐私与安全性"，在页面下方点"仍要打开"；
               - 或在终端运行：`xattr -dr com.apple.quarantine "/Applications/科研小助理.app"`

            数据保存在 `~/Library/Application Support/ResearchPilot/`，每天自动备份。在 Claude Code 里使用：菜单"帮助 → 在 Claude Code 中使用…"。详见 [docs/DEPLOY.md](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOY.md)。
